# SwiftLint Configuration for SwiftHealth
# https://realm.github.io/SwiftLint/

# Paths to include (default: all)
included:
  - Sources
  - Tests

# Paths to exclude
excluded:
  - .build
  - Package.swift

# Enabled rules
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name

# Rule configurations
nesting:
  type_level: 3
  function_level: 3

function_body_length:
  warning: 80
  error: 150

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 400
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

large_tuple:
  warning: 4
  error: 6

force_cast:
  severity: warning

force_try:
  severity: warning

force_unwrapping:
  severity: warning
